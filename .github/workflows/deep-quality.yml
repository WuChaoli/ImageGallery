name: Deep quality reports

on:
  schedule:
    - cron: "41 3 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  randomized-tests:
    name: randomized-tests-seed-${{ github.run_id }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.10"
      - run: uv sync --all-extras --frozen
      - run: uv run pytest --randomly-seed=${{ github.run_id }} -n auto --disable-socket --allow-unix-socket tests/

  stability-tests:
    name: stability-tests-five-runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.10"
      - run: uv sync --all-extras --frozen
      - run: uv run pytest -m stability --count=5 -n 0 --disable-socket tests/

  advisory-reports:
    name: advisory-quality-reports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.10"
      - run: uv sync --all-extras --frozen
      - name: Vulture high-confidence report
        continue-on-error: true
        run: uv run vulture src tools --min-confidence 90
      - name: Third-party warning report
        continue-on-error: true
        run: uv run pytest -W default -n 0 --disable-socket --allow-unix-socket tests/
      - name: External link report
        continue-on-error: true
        run: uv run python tools/check_external_links.py
      - name: Core pure-logic mutation report
        continue-on-error: true
        run: uv run mutmut run

  supported-python-report:
    name: python-${{ matrix.python-version }}-report
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra dev --frozen
      - run: uv run python -m tools.ci test
