name: Release artifacts

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    name: release-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --extra dev --frozen
      - run: uv run python -m tools.ci release-license
      - run: uv run python -m tools.ci package
      - run: uv run python -m tools.ci package-validate
      - run: uv run python -m tools.ci package-smoke
      - run: uv run python -m tools.ci sbom
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: .tmp/ci-dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-gallery-distributions
          path: |
            .tmp/ci-dist/*
            .tmp/image-gallery.cdx.json
          if-no-files-found: error
