[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "image-gallery"
version = "0.1.0"
description = "Local-first image dataset processing framework."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "ImageGallery Maintainers" }
]
dependencies = [
  "defusedxml>=0.7",
  "minio>=7.2",
  "numpy>=1.26",
  "pandas>=2.2,<2.3",
  "pyarrow>=15",
  "pillow>=10",
  "pyyaml>=6.0",
  "requests>=2.31",
  "tomli>=2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=7",
  "pytest-xdist>=3",
  "pytest-socket>=0.7",
  "ruff>=0.5",
  "pyright>=1.1",
  "pandas-stubs>=2.2,<2.3",
  "build>=1.5.1",
  "pip-audit>=2.10.1",
  "cyclonedx-bom>=7.3.0",
  "zizmor>=1.27.0",
  "diff-cover>=9",
  "codespell>=2.4",
  "pymarkdownlnt>=0.9",
  "vulture>=2.14",
  "pytest-randomly>=4",
  "pytest-repeat>=0.9",
  "mutmut>=3",
]
semantic = [
  "onnxruntime>=1.18,<1.24",
  "huggingface-hub>=0.24",
  "faiss-cpu>=1.8"
]
notebook = [
  "jupyter>=1.0",
  "ipykernel>=6",
  "python-dotenv>=1.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = '-m "not slow"'
strict_markers = true
strict_config = true
markers = [
  "slow: tests requiring large datasets or long-running processing",
  "real_dataset: tests requiring sample_1000 and MinIO",
  "stability: tests covering concurrency, state, cache, or resource lifecycle risks",
]

[tool.codespell]
ignore-words-list = "cleane,fo,nd,statics,te"
skip = "*.lock,*.json,*.ipynb,*.csv,*.parquet,*.xml,.git,.tmp,.venv,docs-backup.tar.gz"

[tool.mutmut]
source_paths = [
  "src/image_gallery/cleaning/action_range.py",
  "src/image_gallery/cleaning/rule_evaluator.py",
  "src/image_gallery/schemas/validation.py",
]
pytest_add_cli_args_test_selection = ["tests/unit/cleaning", "tests/unit/schemas"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "D101",
  "D102",
  "D103",
  "D205",
  "D300",
  "S",
  "BLE001",
  "TRY004",
  "PT",
  "C901",
  "C4",
  "SIM102",
  "SIM103",
  "SIM114",
  "SIM115",
  "RET504",
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "S105", "S106", "S108"]

[tool.pyright]
typeCheckingMode = "strict"
reportMissingParameterType = "error"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnknownMemberType = "none"
reportMissingTypeArgument = "warning"
reportPrivateImportUsage = "none"
reportMissingImports = "none"
reportUnsupportedDunderAll = "none"
reportMissingTypeStubs = "none"
reportUnnecessaryIsInstance = "none"
reportUnnecessaryCast = "none"
reportUnknownLambdaType = "none"
reportPrivateUsage = "warning"
