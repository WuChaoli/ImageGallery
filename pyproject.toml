[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "image-gallery"
version = "0.1.0"
description = "Local-first image dataset processing framework."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "ImageGallery Maintainers" }
]
dependencies = [
  "minio>=7.2",
  "pandas>=2.2",
  "pyarrow>=15",
  "pillow>=10",
  "requests>=2.31"
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
  "mypy>=1.10"
]
notebook = [
  "jupyter>=1.0",
  "ipykernel>=6",
  "python-dotenv>=1.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
packages = ["image_gallery"]
strict = true
ignore_missing_imports = true
